version: "3.9"

services:
  db:
    image: postgres:16
    container_name: aiwa-postgres-compose
    environment:
      POSTGRES_DB: aiwa
      POSTGRES_USER: aiwa
      POSTGRES_PASSWORD: aiwa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ai_service:
    build: ./ai_service
    container_name: aiwa-ai-service
    command: uvicorn main:app --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    depends_on:
      - db
    volumes:
      - ./ai_service:/app

  backend:
    build: ./backend
    container_name: aiwa-backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      - db
      - ai_service
    environment:
      DJANGO_SECRET_KEY: change-me
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"

      DJANGO_DB: postgres
      POSTGRES_DB: aiwa
      POSTGRES_USER: aiwa
      POSTGRES_PASSWORD: aiwa
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"

      AI_SERVICE_URL: http://ai_service:5000
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
